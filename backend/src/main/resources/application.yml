server:
  port: ${PORT:8080}
  servlet:
    context-path: /

spring:
  application:
    name: dark-web-deanonymizer-backend

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:deanonymizer_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

  jpa:
    database-platform: ${SPRING_JPA_DATABASE_PLATFORM:org.hibernate.dialect.H2Dialect}
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
    defer-datasource-initialization: true
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          lob:
            non_contextual_creation: true
    open-in-view: false

  sql:
    init:
      mode: always
      continue-on-error: true

  jackson:
    serialization:
      write-dates-as-timestamps: false

# Google Gemini AI Configuration (Configurable via Environment Variables)
gemini:
  api-key: ${GEMINI_API_KEY:}
  model-name: ${GEMINI_MODEL_NAME:gemini-1.5-flash}
  embedding-model: ${GEMINI_EMBEDDING_MODEL:text-embedding-004}

# Platform CORS Configuration
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}
